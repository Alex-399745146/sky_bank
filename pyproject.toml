# pyproject.toml
[project]
name = "sky-bank"
version = "0.1.0"
description = "Учебный курсовой проект"
authors = [
    {name = "Alexsandr Bachevskiy",email = "bachevskiiaa@gmail.com"}
]
readme = "README.md"
#requires-python = ">=3.13"
requires-python = ">=3.11,<4.0.0" # из-за конфликта c библ. cbrapi
dependencies = [
#    "pandas[excel] (>=3.0.0,<4.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "apimoex (>=1.4.0,<2.0.0)",
    "numpy (>=2.4.2,<3.0.0)",
    "pandas >=2.3.2",               # вместо ">=3.0.1,<4.0.0"
    "openpyxl (>=3.1.5,<4.0.0)",
    "cbrapi (>=0.1.6,<0.2.0)"
]

[tool.poetry]
packages = [{include = "sky_bank", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "black (>=26.1.0,<27.0.0)",
    "isort (>=7.0.0,<8.0.0)"
]
dev = [
    "python-dotenv (>=1.2.1,<2.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)"
]

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
check_untyped_defs = false
strict = false
warn_unreachable = false
exclude = [".venv", "__pycache__", ".git"]

[[tool.mypy.overrides]]
module = ['tests.*'] # для какого модуля
allow_untyped_defs = true # переопределение настройки

[tool.black]
line-length = 119
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
  | foo.py
)
'''

[tool.isort]
line_length = 119
